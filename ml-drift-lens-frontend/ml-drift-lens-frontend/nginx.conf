server {
    listen ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── API proxy ────────────────────────────────────────────────────────────
    # Forwards /api/* to Express. BACKEND_API_ORIGIN is the Compose service
    # locally and the Railway private backend origin in production.
    # The trailing slash on proxy_pass strips the /api prefix correctly.
    location /api/ {
        proxy_pass         ${BACKEND_API_ORIGIN}/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Every non-file path serves index.html so React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
    }
}
