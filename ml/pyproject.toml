[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch-ml"
version = "0.1.0"
description = "Baseline network intrusion classifier for ModelWatch"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104,<1",
  "joblib==1.6.0",
  "mlflow>=2.0,<3",
  "numpy>=1.24,<3",
  "packaging>=20",
  "pandas>=2.0,<3",
  "pydantic>=2.0,<3",
  "scikit-learn==1.9.0",
  "uvicorn>=0.24,<1",
  "xgboost==2.1.4"
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "httpx>=0.24"]
dev = ["black>=23", "isort>=5", "mypy>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["model", "inference"]